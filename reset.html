<body>

  <div class="resetBrand">
      <div class="soleBrand soleBrandRings" id="brandHome">
  <span class="soleBrandLetter soleBrandLetterS">Sole</span>

<span class="soleLogoIcon soleLogoSignal" aria-hidden="true">

</span>
</div>

  <main class="resetBox">
    <h2>Reset your password</h2>
    <p>Choose a new password, then return to log in.</p>

    <input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" />

    <button id="resetBtn" class="primary" type="button" disabled>
      Update password
    </button>

    <button id="loginBtn" type="button" hidden>
      Return to log in
    </button>

    <p id="status">Checking recovery session...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const sb = supabase.createClient(
      "https://kmnutzpbbvrfizwimcpk.supabase.co",
      "sb_publishable_yr1M07ih1yEbqHma0cihdw_t7nDQDbU"
    );

    const newPasswordEl = document.getElementById("newPassword");
    const resetBtn = document.getElementById("resetBtn");
    const loginBtn = document.getElementById("loginBtn");
    const statusEl = document.getElementById("status");

    let recoveryReady = false;

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.classList.toggle("isError", kind === "error");
      statusEl.classList.toggle("isSuccess", kind === "success");
    }

    function markReady() {
      recoveryReady = true;
      resetBtn.disabled = false;
      setStatus("Recovery session ready. You can update your password.");
    }

    function goToLogin() {
      window.location.href = "./index.html";
    }

    loginBtn.addEventListener("click", goToLogin);

    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY" || session) {
        markReady();
      }
    });

    (async () => {
      const { data, error } = await sb.auth.getSession();

      if (error) {
        console.error(error);
        setStatus("Could not read recovery session.", "error");
        return;
      }

      if (data.session) {
        markReady();
      } else {
        setStatus("No recovery session detected yet. Open this page from your reset email.", "error");
      }
    })();

    resetBtn.onclick = async () => {
      if (!recoveryReady) {
        setStatus("Recovery session is still loading. Please wait a moment and try again.", "error");
        return;
      }

      const password = newPasswordEl.value.trim();

      if (!password) {
        setStatus("Enter a new password.", "error");
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = "Updating...";
      setStatus("Updating password...");

      const { error } = await sb.auth.updateUser({ password });

      if (error) {
        resetBtn.disabled = false;
        resetBtn.textContent = "Update password";
        setStatus(error.message, "error");
        return;
      }

setStatus("Password updated. Taking you back to log in...", "success");

await sb.auth.signOut();

newPasswordEl.hidden = true;
resetBtn.hidden = true;
loginBtn.hidden = false;

window.setTimeout(goToLogin, 1400);
    };
  </script>
