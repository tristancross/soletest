<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sole</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/chat.css" />
  <link rel="stylesheet" href="./css/quiz.css" />
  <link rel="stylesheet" href="./css/modules.css" />
  <link rel="stylesheet" href="./css/solemate.css" />
  <link rel="stylesheet" href="./css/insights.css" />
  <link rel="stylesheet" href="./css/admin.css" />
  <link rel="stylesheet" href="./css/themecolours.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
<div id="authScreen" class="authScreen">
  <div class="authBox">
    <h2 id="authTitle">Log in</h2>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <input id="loginIdentifier" type="text" placeholder="Email or username" />
<div class="passwordField">
  <input id="loginPassword" type="password" placeholder="Password">
    <button class="togglePassword" type="button">👁</button>
</div>

      <button id="forgotPasswordBtn" class="btnGhost small" type="button">
        Forgot password?
      </button>

      <button id="loginBtn" type="button">Log in</button>
      <button id="showSignupBtn" class="btnGhost" type="button">Sign up</button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" hidden>
      <input id="signupUsername" type="text" placeholder="Username" />
      <input id="signupEmail" type="email" placeholder="Email" />
<div class="passwordField">
  <input id="signupPassword" type="password" placeholder="Password">
    <button class="togglePassword" type="button">👁</button>
</div>

<div class="passwordField">
  <input id="signupPasswordRepeat" type="password" placeholder="Repeat password">
   <button class="togglePassword" type="button">👁</button>
</div>

      <button id="createAccountBtn" type="button">Create account</button>
      <button id="showLoginBtn" class="btnGhost" type="button">Back to log in</button>
    </div>

    <p id="authError"></p>
  </div>
</div>

  <div class="app soleRedesignApp">
<nav class="soleRailNav" aria-label="Primary navigation">
  <button class="soleRailMenuBtn" type="button" aria-label="Open navigation">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="soleRailItems">
    <button class="soleRailItem isActive" type="button" data-sole-rail="home" aria-label="Home">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>

    <button class="soleRailItem" type="button" data-sole-rail="attraction" aria-label="Attraction">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>Attraction</span>
    </button>

    <button class="soleRailItem" type="button" data-sole-rail="connection" aria-label="Connection">
  <i class="fa-solid fa-circle-nodes"></i>
  <span>Connection</span>
</button>

<button class="soleRailItem" type="button" data-sole-rail="solemate" aria-label="Solemate">
  <i class="fa-solid fa-heart-circle-bolt"></i>
  <span>Solemate</span>
</button>
  </div>

  <div class="soleRailBottom">
    <button class="soleRailItem" type="button" data-sole-rail="settings" aria-label="Settings">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </button>

<div class="soleRailAccount" id="soleRailAccount">
  <button class="soleRailUser" type="button" data-sole-rail="account" aria-label="Account">
    <span id="soleRailUserInitial">A</span>
  </button>

  <div class="soleRailAccountMenu" id="soleRailAccountMenu">
    <div class="soleRailAccountName" id="soleRailAccountName"></div>

    <button class="soleRailAccountItem" type="button" id="soleRailLogoutBtn">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span>Logout</span>
    </button>
  </div>
</div>
  </div>
</nav>
<aside class="sidebar soleDashboardPane">
  <div class="sidebarTop">
<div class="soleBrand soleBrandRings" id="brandHome">
  <span class="soleBrandLetter soleBrandLetterS">Sole</span>

  <span class="soleLogoIcon soleLogoIcon01" aria-hidden="true">
    <span class="sole01Halo"></span>
    <span class="sole01Core"></span>

  </span>
</div>
  </div>

  <section class="sidebarNavPane">
<section class="sidebarProgressPanel" aria-label="Sole model status">
  <div class="progressStatsRow">
    <button class="progressStat" type="button" data-progress-card="attraction" data-sole-rail="attraction">
      <strong id="attractionProgressValue">0%</strong>
      <span class="progressStatLabel">Attraction</span>
    </button>

    <button class="progressStat" type="button" data-progress-card="connection" data-sole-rail="connection">
      <strong id="connectionProgressValue">0%</strong>
      <span class="progressStatLabel">Connection</span>
    </button>

    <button class="progressStat" type="button" data-progress-card="confidence">
      <strong id="confidenceProgressValue">0%</strong>
      <span class="progressStatLabel">Confidence</span>
    </button>

    <button class="progressStat" type="button" data-progress-card="candidates">
      <strong id="candidatePoolValue">102437</strong>
      <span class="progressStatLabel">Candidates</span>
    </button>
  </div>
</section>
<section class="sidebarTasksPane">
    <div class="sidebarTasksHeader">
  <div class="sectionTitle">Daily tasks</div>
  <div class="sidebarTasksCount" id="sidebarTasksCount">0 of 0 completed</div>
</div>

<div class="sidebarTaskList">
    <button class="sidebarTaskCard" type="button" data-dashboard-screen="attraction" data-task-id="attraction">
    <div class="sidebarTaskIcon attraction">
      <i class="fa-regular fa-eye"></i>
    </div>

    <div class="sidebarTaskText">
      <div class="sidebarTaskTitle">Complete Attraction Mapping</div>
      <div class="sidebarTaskDesc">Visual preference and desire analysis</div>
    </div>

    <div class="sidebarTaskAction">Continue</div>
  </button>
  
  <button class="sidebarTaskCard" type="button" data-dashboard-screen="chemistry" data-task-id="chemistry">
    <div class="sidebarTaskIcon chemistry">
      <i class="fa-solid fa-flask"></i>
    </div>

    <div class="sidebarTaskText">
      <div class="sidebarTaskTitle">Complete Connection Calibration</div>
      <div class="sidebarTaskDesc">Core compatibility analysis</div>
    </div>

    <div class="sidebarTaskAction">Continue</div>
  </button>

<button class="sidebarTaskCard" type="button" data-task-id="replies">
  <div class="sidebarTaskIcon replies">
    <i class="fa-regular fa-message"></i>
  </div>

  <div class="sidebarTaskText">
    <div class="sidebarTaskTitle">Receive 50 replies from your partner</div>
    <div class="sidebarTaskDesc">
      <span id="replyTaskCount">0</span> / 50 received
    </div>

    <div class="sidebarMiniProgress">
      <div id="replyTaskProgress"></div>
    </div>
  </div>

  <div class="sidebarTaskAction isStatus">Active</div>
</button>
</div>
</section>


  </section>

<div id="userList" hidden></div>

<div class="sidebarBottom">
  <button class="btn btnGhost" id="adminToggleBtn" hidden>Admin view</button>
</div>
</aside>
    <div class="mobileSidebarBackdrop" id="mobileSidebarBackdrop"></div>

    <main class="main">
<header class="header">
<div class="chatMeta">
  <div class="chatMetaInner is-active" id="chatMetaInner">
    <div class="chatTitle" id="chatTitle"></div>
    <div class="chatSubtitle" id="chatSubtitle"></div>
  </div>
</div>
<button class="mobileMenuBtn" id="mobileMenuBtn" aria-label="Open chats">
  <i class="fa-regular fa-message"></i>
  <span class="mobileMenuUnreadBadge" id="mobileMenuUnreadBadge" hidden></span>
</button>

  <!-- ADMIN ONLY UI (hidden by default) -->
<div class="headerRight" id="adminControls" hidden>
  <div class="adminRow">
    <label class="smallLabel">View thread:</label>
    <select id="adminA"></select>
    <span class="muted">Ã¢â€ â€</span>
    <select id="adminB"></select>
    <button class="btn" id="adminLoadBtn">Load</button>
    <button class="btn btnGhost" id="adminBlockBtn">Block</button>
    <button class="btn btnGhost" id="adminUnblockBtn">Unblock</button>
  </div>

  <div class="adminRow">
  <label class="smallLabel">Pair users:</label>
  <select id="pairUserA"></select>
  <span class="muted">Ã¢â€ â€</span>
  <select id="pairUserB"></select>
  <button class="btn" id="createPairBtn">Create pair</button>
  <button class="btn btnGhost" id="clearPairBtn">Clear pair</button>
</div>

  <div class="adminRow">
    <label class="smallLabel">View dashboard:</label>
    <select id="adminDashboardUser"></select>
    <button class="btn" id="adminLoadDashboardBtn">Load dashboard</button>
  </div>
</div>
</header>

      <section class="messages" id="messages">
        <div id="typingIndicator">
  <span class="typingDot"></span>
  <span class="typingText"></span>
</div>
      </section>

<footer class="composer">
  <div class="formatBar" id="formatBar" hidden>
<button type="button" class="formatBtn" id="boldBtn" aria-label="Bold"><strong>B</strong></button>
<button type="button" class="formatBtn" id="italicBtn" aria-label="Italic"><em>I</em></button>
<button type="button" class="formatBtn" id="underlineBtn" aria-label="Underline"><u>U</u></button>
<button type="button" class="formatBtn" id="bulletBtn" aria-label="Bulleted list">Ã¢â‚¬Â¢</button>

</div>

  <div class="composerInner" id="composerInner">

    <textarea
      class="input"
      id="textInput"
      placeholder="Ask anything"
      rows="1"
    ></textarea>

    <button class="deleteRecordBtn" id="deleteRecordBtn" hidden aria-label="Delete recording">
      <i class="fa-regular fa-trash-can"></i>
    </button>

    <div class="recordingMeta" id="recordingMeta" hidden>
      <span class="recordDot"></span>
      <span class="recordingTimer" id="recordingTimer">0:00</span>
    </div>

    <div class="recordingPreview" id="recordingPreview" hidden>
<button id="previewPlayBtn" class="previewPlayBtn" type="button" aria-label="Play recording">
  <i class="fa-solid fa-play"></i>
</button>
      <div class="previewProgress" id="previewProgress">
        <div class="previewProgressFill" id="previewProgressFill"></div>
      </div>
    </div>

    <button class="micBtn" id="micBtn" aria-label="Record voice message">
      <i class="fa-solid fa-microphone"></i>
    </button>

    <button class="sendBtnIcon" id="sendBtn" aria-label="Send" disabled>
      <i class="fa-solid fa-arrow-up"></i>
    </button>

  </div>
</footer>
    </main>
  </div>

  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  

  <script src="manifest.js"></script>

  <script src="js/dashboard.dataBuilders.js"></script>
  <script src="js/dashboard.defaultAssignments.js"></script>
<script src="js/dashboard.matrixDefinitions.js"></script>
<script src="js/dashboard.matrixRendering.js"></script>
<script src="js/dashboard.userScoring.js"></script>
<script src="js/dashboard.dayConfig.js"></script>
<script src="js/dashboard.scoring.js"></script>
<script src="js/dashboard.metrics.js"></script>
<script src="js/dashboard.quizRendering.js"></script>
  <script src="js/dashboard.adminBuilder.js"></script>
  <script src="js/dashboard.mountAndExport.js"></script>

  <script src="js/app.config.js"></script>
  <script src="js/app.state.js"></script>
  <script src="js/app.dom.js"></script>
  <script src="js/app.auth.js"></script>
  <script src="js/app.helpersUi.js"></script>
  <script src="js/app.mobile.js"></script>
  <script src="js/app.voiceMessage.js"></script>
  <script src="js/app.sidebar.js"></script>
  <script src="js/app.statusUpdates.js"></script>
  <script src="js/app.normalChat.js"></script>
  <script src="js/app.renderThread.js"></script>
  <script src="js/app.realtime.js"></script>
  <script src="js/app.initChat.js"></script>
  <script src="js/app.sendText.js"></script>
  <script src="js/app.adminViewer.js"></script>
  <script src="js/app.switchUser.js"></script>

  <script src="js/sole.redesign.js"></script>
  <script src="js/app.boot.js"></script>

</body>
</html>
